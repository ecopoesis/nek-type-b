[project]
name = "nek-case"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "build123d>=0.13.0",
    "numpy>=2.5.4",
    "svgpathtools>=1.8.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
